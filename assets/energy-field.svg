<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1000" preserveAspectRatio="none">
<defs>
  <!-- Multi-stop neon energy gradient: Deep Royal Blue -> Vivid Cyan -> Electric Violet -> Magenta -> Warm Amber/Gold -->
  <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
    <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.8"/>
    <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.95"/>
    <stop offset="70%" stop-color="#c084fc" stop-opacity="0.9"/>
    <stop offset="88%" stop-color="#fb923c" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="flowWarm" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
    <stop offset="35%" stop-color="#ec4899" stop-opacity="0.85"/>
    <stop offset="75%" stop-color="#f97316" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="flowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
    <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.8"/>
    <stop offset="70%" stop-color="#a855f7" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
  </linearGradient>

  <!-- Ambient Glow Filters -->
  <filter id="softGlow" x="-60%" y="-30%" width="220%" height="160%">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="ambientWide" x="-80%" y="-40%" width="260%" height="180%">
    <feGaussianBlur stdDeviation="14" result="wide"/>
    <feMerge>
      <feMergeNode in="wide"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background Ambient Halo Glows -->
<g fill="none" stroke-linecap="round" filter="url(#ambientWide)" opacity="0.38">
  <path d="M600 40 C410 95 465 190 260 240 S410 385 120 460 S305 610 20 720" stroke="url(#flowGrad)" stroke-width="9"/>
  <path d="M615 130 C395 195 505 285 275 335 S435 490 75 580 S295 765 10 870" stroke="url(#flowWarm)" stroke-width="8"/>
  <path d="M595 260 C425 310 515 395 305 440 S435 585 100 670 S285 830 35 950" stroke="url(#flowCyan)" stroke-width="10"/>
</g>

<!-- Precise Crisp Neon Wave Ribbons -->
<g fill="none" stroke-linecap="round" filter="url(#softGlow)">
  <!-- Ribbon 1 -->
  <path d="M610 20 C420 75 485 160 280 210 S420 355 135 435 S315 575 25 695" stroke="url(#flowGrad)" stroke-width="2.6" stroke-dasharray="190 55 80 95">
    <animate attributeName="stroke-dashoffset" from="0" to="-620" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Ribbon 2 -->
  <path d="M620 75 C435 130 515 215 290 265 S450 405 105 490 S305 645 15 740" stroke="url(#flowWarm)" stroke-width="1.8" stroke-dasharray="130 45 220 80">
    <animate attributeName="stroke-dashoffset" from="0" to="-700" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- Ribbon 3 -->
  <path d="M610 150 C385 210 505 290 250 345 S425 495 70 575 S275 735 5 840" stroke="url(#flowGrad)" stroke-width="3" stroke-dasharray="240 65 110 120">
    <animate attributeName="stroke-dashoffset" from="0" to="-720" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Ribbon 4 -->
  <path d="M615 210 C445 255 540 345 320 395 S460 535 130 625 S320 795 30 905" stroke="url(#flowCyan)" stroke-width="1.4" stroke-dasharray="90 55 180 70">
    <animate attributeName="stroke-dashoffset" from="0" to="-650" dur="6.5s" repeatCount="indefinite"/>
  </path>

  <!-- Ribbon 5 -->
  <path d="M600 305 C435 355 515 430 290 480 S425 630 85 715 S265 860 20 975" stroke="url(#flowGrad)" stroke-width="2.2" stroke-dasharray="160 50 100 90">
    <animate attributeName="stroke-dashoffset" from="0" to="-640" dur="7.8s" repeatCount="indefinite"/>
  </path>

  <!-- Ribbon 6 -->
  <path d="M620 365 C470 415 540 495 355 545 S445 695 150 775 S305 905 45 995" stroke="url(#flowWarm)" stroke-width="1.6" stroke-dasharray="110 45 170 75">
    <animate attributeName="stroke-dashoffset" from="0" to="-600" dur="8.5s" repeatCount="indefinite"/>
  </path>

  <!-- Ribbon 7 -->
  <path d="M600 430 C460 470 530 560 325 605 S405 750 110 835 S260 930 25 1000" stroke="url(#flowGrad)" stroke-width="2.5" stroke-dasharray="210 70 95 80">
    <animate attributeName="stroke-dashoffset" from="0" to="-690" dur="7.2s" repeatCount="indefinite"/>
  </path>
</g>

<!-- Floating Starlight / Energy Particles -->
<g fill="#ffffff" filter="url(#softGlow)">
  <circle cx="150" cy="430" r="2.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="110" cy="570" r="1.8"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="175" cy="710" r="2.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="95" cy="830" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="320" r="1.9"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
</g>
</svg>
