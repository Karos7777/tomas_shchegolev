<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Sunrise Gradient: Warm Coral to Sunny Golden Yellow -->
    <linearGradient id="sunriseBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ee6348"/>
      <stop offset="32%" stop-color="#f48446"/>
      <stop offset="68%" stop-color="#f9b736"/>
      <stop offset="100%" stop-color="#fed646"/>
    </linearGradient>

    <!-- Inside Shield Sky Gradient -->
    <linearGradient id="shieldSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eb5a3b"/>
      <stop offset="45%" stop-color="#f27d42"/>
      <stop offset="100%" stop-color="#fbb739"/>
    </linearGradient>

    <!-- Inside Shield Road / Ground Gradient -->
    <linearGradient id="shieldGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ee6040"/>
      <stop offset="100%" stop-color="#dc4226"/>
    </linearGradient>

    <!-- Soft Depth Shadow for the Shield -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#841e06" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.14"/>
    </filter>

    <!-- Inner Shield Clip Path -->
    <clipPath id="shieldInnerClip">
      <path d="M 256 122 C 304 159 348 171 378 178 C 378 253 336 317 256 377 C 176 317 134 253 134 178 C 164 171 208 159 256 122 Z"/>
    </clipPath>
  </defs>

  <!-- Squircle Base with Smooth Corner Radius -->
  <rect width="512" height="512" rx="118" fill="url(#sunriseBg)"/>

  <!-- Shield Group with Glow & Shadow -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Shield Ivory White Frame -->
    <path d="M 256 94 C 316 140 372 156 410 165 C 410 268 358 348 256 418 C 154 348 102 268 102 165 C 140 156 196 140 256 94 Z" fill="#fffaee"/>

    <!-- Shield Inner Content -->
    <g clip-path="url(#shieldInnerClip)">
      <!-- Top Sky Area -->
      <rect x="90" y="90" width="332" height="186" fill="url(#shieldSky)"/>
      <!-- Bottom Ground Area -->
      <rect x="90" y="274" width="332" height="150" fill="url(#shieldGround)"/>

      <!-- 5 Sun Rays in ivory white (Matching Sunrise Shield Warm exactly) -->
      <!-- Center Ray 1: Straight vertical 90° -->
      <line x1="256" y1="144" x2="256" y2="218" stroke="#fffaee" stroke-width="16" stroke-linecap="round"/>
      <!-- Right Ray 2: ~55° -->
      <line x1="322" y1="164" x2="284" y2="226" stroke="#fffaee" stroke-width="16" stroke-linecap="round"/>
      <!-- Right Ray 3: ~20° -->
      <line x1="364" y1="222" x2="306" y2="248" stroke="#fffaee" stroke-width="16" stroke-linecap="round"/>
      <!-- Left Ray 4: ~125° -->
      <line x1="190" y1="164" x2="228" y2="226" stroke="#fffaee" stroke-width="16" stroke-linecap="round"/>
      <!-- Left Ray 5: ~160° -->
      <line x1="148" y1="222" x2="206" y2="248" stroke="#fffaee" stroke-width="16" stroke-linecap="round"/>

      <!-- Rising Sun (Half-Circle) -->
      <path d="M 198 274 A 58 58 0 0 1 314 274 Z" fill="#fffaee"/>

      <!-- Horizontal Horizon Divider Bar -->
      <rect x="122" y="268" width="268" height="12" rx="6" fill="#fffaee"/>

      <!-- Perspective Road / Path -->
      <path d="M 256 278 L 298 394 L 214 394 Z" fill="#fffaee"/>
    </g>
  </g>
</svg>
